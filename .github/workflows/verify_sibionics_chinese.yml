name: 0. Verify Chinese SIBIONICS
run-name: Verify Chinese SIBIONICS (${{ github.ref_name }})

on:
  workflow_dispatch:
  push:
    branches:
      - sibionics-chinese-v115g
  pull_request:

permissions:
  contents: read

concurrency:
  group: sibionics-chinese-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify algorithm and compile simulator app
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DERIVED_DATA: ${{ runner.temp }}/xdrip-derived-data
      BUILD_LOG: ${{ runner.temp }}/xcodebuild.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Verify Chinese SIBIONICS V115G bundle
        run: node Tools/SibionicsV115G/verify-bundle.js

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace xdrip.xcworkspace \
            -scheme xdrip

      - name: Build unsigned iOS Simulator app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace xdrip.xcworkspace \
            -scheme xdrip \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build | tee "$BUILD_LOG"

      - name: Package simulator app
        shell: bash
        run: |
          products="$DERIVED_DATA/Build/Products/Debug-iphonesimulator"
          app_path=''
          for candidate in "$products"/*.app; do
            if [ -d "$candidate" ]; then
              app_path="$candidate"
              break
            fi
          done

          if [ -z "$app_path" ]; then
            echo "No top-level .app was produced in $products" >&2
            exit 1
          fi

          echo "Packaging $app_path"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            "${{ runner.temp }}/xdrip-simulator.app.zip"

      - name: Upload simulator app
        uses: actions/upload-artifact@v6
        with:
          name: xdrip-sibionics-chinese-simulator
          path: ${{ runner.temp }}/xdrip-simulator.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xdrip-sibionics-chinese-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
